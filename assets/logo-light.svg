<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="grok-install">
  <defs>
    <linearGradient id="spectralLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6004C"/>
      <stop offset="100%" stop-color="#008B82"/>
    </linearGradient>
    <radialGradient id="nebulaLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1E70" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FF1E70" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background pill -->
  <rect x="0" y="0" width="320" height="80" rx="14" ry="14" fill="#FFFFFF"/>

  <!-- Faint nebula tint -->
  <circle cx="40" cy="40" r="60" fill="url(#nebulaLight)"/>
  <circle cx="280" cy="40" r="50" fill="url(#nebulaLight)"/>

  <!-- Top accent -->
  <rect x="0" y="0" width="320" height="2" rx="1" fill="url(#spectralLight)"/>

  <!-- Bracket monogram -->
  <g transform="translate(18, 20)">
    <path d="M 0 0 L 0 40 L 8 40" stroke="#D6004C" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 30 0 L 30 40 L 22 40" stroke="#008B82" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="15" cy="20" r="3.5" fill="#D6004C"/>
    <circle cx="15" cy="20" r="1.5" fill="#008B82"/>
  </g>

  <!-- Wordmark -->
  <text x="68" y="32"
    font-family="'Inter', 'Inter Tight', system-ui, sans-serif"
    font-size="22"
    font-weight="800"
    letter-spacing="-0.04em"
    fill="#0A0A0A">grok-install</text>

  <!-- Tagline -->
  <text x="68" y="52"
    font-family="'JetBrains Mono', monospace"
    font-size="9"
    font-weight="500"
    letter-spacing="0.18em"
    fill="#008B82">SPECTRAL · GROK-NATIVE AGENTS</text>

  <!-- Version pill -->
  <rect x="68" y="58" width="42" height="14" rx="7" fill="#FFFFFF" stroke="#D6004C" stroke-width="0.8"/>
  <text x="89" y="68"
    font-family="'JetBrains Mono', monospace"
    font-size="8"
    font-weight="500"
    text-anchor="middle"
    fill="#D6004C">v2.13</text>
</svg>
