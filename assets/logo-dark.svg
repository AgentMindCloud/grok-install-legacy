<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="grok-install">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="spectral" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E70"/>
      <stop offset="100%" stop-color="#00E0D5"/>
    </linearGradient>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1E70" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF1E70" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background pill -->
  <rect x="0" y="0" width="320" height="80" rx="14" ry="14" fill="#0A0A0A"/>

  <!-- Nebula tint -->
  <circle cx="40" cy="40" r="60" fill="url(#nebula)"/>
  <circle cx="280" cy="40" r="50" fill="url(#nebula)" opacity="0.6" transform="scale(1)"/>

  <!-- Top accent line (Spectral gradient) -->
  <rect x="0" y="0" width="320" height="2" rx="1" fill="url(#spectral)"/>

  <!-- Bracket monogram -->
  <g transform="translate(18, 20)" filter="url(#glow)">
    <path d="M 0 0 L 0 40 L 8 40" stroke="#FF1E70" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 30 0 L 30 40 L 22 40" stroke="#00E0D5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="15" cy="20" r="3.5" fill="#FF1E70"/>
    <circle cx="15" cy="20" r="1.5" fill="#00E0D5"/>
  </g>

  <!-- Wordmark -->
  <text x="68" y="32"
    font-family="'Inter', 'Inter Tight', system-ui, sans-serif"
    font-size="22"
    font-weight="800"
    letter-spacing="-0.04em"
    fill="#FFFFFF"
    filter="url(#glow)">grok-install</text>

  <!-- Tagline -->
  <text x="68" y="52"
    font-family="'JetBrains Mono', monospace"
    font-size="9"
    font-weight="500"
    letter-spacing="0.18em"
    fill="#00E0D5">SPECTRAL · GROK-NATIVE AGENTS</text>

  <!-- Version pill -->
  <rect x="68" y="58" width="42" height="14" rx="7" fill="#0A0A0A" stroke="#FF1E70" stroke-width="0.8"/>
  <text x="89" y="68"
    font-family="'JetBrains Mono', monospace"
    font-size="8"
    font-weight="500"
    text-anchor="middle"
    fill="#FF1E70">v2.13</text>
</svg>
