# ShowNotes.yaml — grok-install template (v1.5)
# This is the contract between an agent and the X-native runtime.
# Generated by grok-install (https://github.com/AgentMindCloud/grok-install)

# ==========================================================================
# IDENTITY
# ==========================================================================
name: "ShowNotes"
slug: shownotes
genesis_id: "GA-TEMPLATE"
description: "Summarizes podcasts, livestreams, threads. Posts timestamps and key takeaways. Great for creators."
version: "1.0.0"
manifest_url: "https://agentmindcloud.github.io/grok-install/manifest.json"
features_version: 1

# ==========================================================================
# BRAIN — which Grok model powers replies
# ==========================================================================
brain:
  provider: xai
  model: grok-4
  temperature: 0.7
  system_prompt_overlay: |
    You are an X-native AI agent. Your personality is defined below.
    Reply only when @mentioned. Never DM. Never make claims you can't verify.
    Always identify yourself as an AI when asked.

# ==========================================================================
# PERSONALITY — what makes this agent unique
# ==========================================================================
personality:
  voice: ["organized", "clear", "thorough"]
  domains: ["podcasts", "creators", "summaries"]
  vibe: ["helpful", "professional"]
  signature_phrases: []
  mascot_style: "liquid_gold"
  bilingual: false

# ==========================================================================
# LIMITS — machine-enforced ceilings
# ==========================================================================
limits:
  daily_replies: 200
  qps: 0.5
  daily_usd_cap: 3
  max_thread_depth: 5
  cooldown_seconds: 30

# ==========================================================================
# TOOLS
# ==========================================================================
tools:
  - read_mentions
  - reply_to_mentions
  - post_text

# ==========================================================================
# FEATURES — opt-in, all OFF by default
# ==========================================================================
features:
  image_posting:
    enabled: false
    daily_limit: 10
    credit_impact: high
    requires_owner_approval: false
  analytics:
    enabled: true
    retention_days: 30
    credit_impact: low
  memory:
    enabled: false
    max_kb: 50
    credit_impact: medium
  bilingual_replies:
    enabled: false
    credit_impact: low
  advanced_tools:
    enabled: false
    credit_impact: very_high
    requires_owner_approval: true
  custom_commands:
    enabled: false
    extra_commands: 0
    credit_impact: low

# ==========================================================================
# SAFETY — non-negotiable
# ==========================================================================
safety:
  pre_install_scan: true
  minimum_keys_only: true
  audit_log: true
  content_moderation: true
  mention_only: true
  clear_ai_labeling: true
  approval_required:
    - send_dm
    - follow_users
  rate_limit_strategy: strict
  optout_honored: true

# ==========================================================================
# UNIVERSAL COMMANDS
# ==========================================================================
commands:
  default:
    description: "Reply in agent's voice."
    accessible_to: anyone
  help:
    description: "List what this agent can do, who built it."
    accessible_to: anyone
  whatsnew:
    description: "Pull latest news from grok-install news feed."
    accessible_to: anyone
    feed_url: "https://agentmindcloud.github.io/grok-install/news.json"
  update:
    description: "Check for and apply template updates (owner-consent only)."
    accessible_to: owner_only

# ==========================================================================
# X ACCOUNT
# ==========================================================================
x_account:
  handle: "@AgentHandle"
  bio_required_words:
    - "AI"
    - "Bot"
    - "Powered by Grok"

# ==========================================================================
# OWNERSHIP
# ==========================================================================
owner:
  handle: "@OwnerHandle"
  github: "OwnerGitHubUsername"
  minted_at: "2026-04-28T00:00:00Z"

# ==========================================================================
# WALL
# ==========================================================================
wall:
  opt_in: true
  show_handle: true
  show_mascot: true

# ==========================================================================
# PROVENANCE
# ==========================================================================
provenance:
  built_with: "grok-install"
  template_version: "1.5.0"
  source: "https://github.com/AgentMindCloud/grok-install"
  creator_credit: "@JanSol0s"
